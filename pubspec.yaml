
name: clientPhysiho
description: Aplicación móvil Physiho.
publish_to: "none"

# 3.0.1 = versión visible para el usuario.
# 29 = versionCode de Android.
# Si ya existe una compilación 28 en Google Play, la siguiente debe ser 29.
version: 3.0.1+29

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Interfaz y estado
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  mvc_pattern: ^8.12.0
  direct_select: ^2.0.0
  select_form_field: ^2.2.0
  loading_overlay: ^0.3.0
  date_field: ^3.0.5
  table_calendar: ^3.2.0

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0

  # Autenticación
  google_sign_in: ^6.3.0
  flutter_web_auth_2: 5.0.3
  the_apple_sign_in: ^1.1.1
  crypto: ^3.0.2

  # Ubicación y mapas
  geolocator: ^9.0.2
  geocoding: ^2.2.2
  google_maps_flutter: ^2.2.5

  # Navegación y enlaces
  go_router: ^12.1.3
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  flutter_custom_tabs: 2.4.1

  # Almacenamiento y red
  shared_preferences: ^2.0.20
  http: ^1.6.0
  flutter_dotenv: ^5.2.1

  # Recursos visuales
  cached_network_image: ^3.2.3
  clippy_flutter: ^2.0.0-nullsafety.1
  flutter_svg: ^1.1.6
  google_fonts: ^7.1.0
  fluttertoast: ^8.2.14
  lottie: ^2.7.0
  flutter_statusbarcolor_ns: ^0.5.0

  # Utilidades
  intl: any
  vector_math: any

# Se conserva temporalmente porque algunas dependencias antiguas del proyecto
# todavía requieren intl 0.17.x.
dependency_overrides:
  intl: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher_iconph.png"
  adaptive_icon_background: "assets/images/launcher_iconph.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/.env

